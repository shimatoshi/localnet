<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunnel URL Board</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .container { max-width: 550px; width: 90%; }
  h1 { font-size: 1rem; color: #666; text-align: center; margin-bottom: 1.5rem; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  .name { font-size: 0.85rem; color: #888; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .url { font-size: 1rem; word-break: break-all; }
  .url a { color: #58a6ff; text-decoration: none; }
  .url a:hover { text-decoration: underline; }
  .meta { font-size: 0.8rem; color: #555; margin-top: 0.5rem; }
  .none { color: #666; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <h1>Tunnel URL Board</h1>
  <div id="services">Loading...</div>
</div>
<script>
async function check() {
  try {
    const r = await fetch('/api/url');
    const data = await r.json();
    const el = document.getElementById('services');
    el.innerHTML = data.map(s => `
      <div class="card">
        <div class="name">${s.name}</div>
        <div class="url">${s.url
          ? `<a href="${s.url}" target="_blank">${s.url}</a>`
          : '<span class="none">not registered</span>'}</div>
        <div class="meta">${s.updated ? new Date(s.updated).toLocaleString('ja-JP') : ''}</div>
      </div>
    `).join('');
  } catch { document.getElementById('services').textContent = 'API error'; }
}
check();
setInterval(check, 30000);
</script>
</body>
</html>
