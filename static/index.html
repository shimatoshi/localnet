<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Localnet</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" type="image/png" href="/static/icon-192.png">
</head>
<body>

  <!-- ===== ホーム（Google風） ===== -->
  <div id="screen-home" class="screen">
    <div id="home-center">
      <h1 id="home-logo">Localnet</h1>
      <p id="home-sub">your offline internet</p>
      <div id="home-search-wrap">
        <input type="search" id="home-search" placeholder="検索" autocomplete="off">
        <div id="home-suggest" class="suggest-dropdown hidden"></div>
      </div>
      <div id="home-shortcuts"></div>
    </div>
    </div>
  </div>

  <!-- ===== 検索結果 ===== -->
  <div id="screen-results" class="screen hidden">
    <div id="results-header">
      <span id="results-logo" onclick="goHome()">Localnet</span>
      <div id="results-search-wrap">
        <input type="search" id="results-search" autocomplete="off">
        <div id="results-suggest" class="suggest-dropdown hidden"></div>
      </div>
    </div>
    <div id="results-web"></div>
  </div>

  <!-- ===== ブラウザ（全画面） ===== -->
  <div id="screen-browser" class="screen hidden">
    <iframe id="browser-frame" sandbox="allow-scripts allow-same-origin"></iframe>
    <div id="browser-bar">
      <button onclick="browserBack()" id="btn-back" class="bar-btn" disabled>&#9664;</button>
      <button onclick="browserForward()" id="btn-forward" class="bar-btn" disabled>&#9654;</button>
      <button onclick="goHome()" class="bar-btn">&#9679;</button>
      <button onclick="showTabs()" class="bar-btn" id="btn-tabs"><span id="tab-count">1</span></button>
      <button onclick="toggleMenu()" class="bar-btn">&#8942;</button>
    </div>
    <div id="browser-menu" class="hidden">
      <button onclick="toggleBookmark()"><span id="menu-bm-icon">&#9734;</span> ブックマーク</button>
      <button onclick="sharePage()">&#8599; 共有</button>
      <button onclick="showScreen('screen-history')">&#9201; 履歴</button>
      <button onclick="showScreen('screen-bookmarks')">&#9733; ブックマーク一覧</button>
      <button onclick="showScreen('screen-crawl')">&#127760; クロール</button>
    </div>
  </div>

  <!-- ===== タブ一覧 ===== -->
  <div id="screen-tabs" class="screen hidden">
    <div class="sub-header">
      <button onclick="closeSubScreen()" class="back-btn">&larr;</button>
      <h2>タブ</h2>
      <button onclick="addNewTab()" class="action-link">+ 新規</button>
    </div>
    <div id="tabs-list"></div>
  </div>

  <!-- ===== 履歴 ===== -->
  <div id="screen-history" class="screen hidden">
    <div class="sub-header">
      <button onclick="closeSubScreen()" class="back-btn">&larr;</button>
      <h2>履歴</h2>
      <button onclick="clearHistory()" class="action-link">消去</button>
    </div>
    <div id="history-list"></div>
  </div>

  <!-- ===== ブックマーク一覧 ===== -->
  <div id="screen-bookmarks" class="screen hidden">
    <div class="sub-header">
      <button onclick="closeSubScreen()" class="back-btn">&larr;</button>
      <h2>ブックマーク</h2>
    </div>
    <div id="bookmarks-list"></div>
  </div>

  <!-- ===== データセット ===== -->
  <div id="screen-data" class="screen hidden">
    <div class="sub-header">
      <button onclick="closeSubScreen()" class="back-btn">&larr;</button>
      <h2>Datasets</h2>
    </div>
    <div id="data-offline" class="hidden">
      <p class="muted" style="padding:8px 16px">オフライン</p>
    </div>
    <section id="server-datasets-section" style="margin-top:0">
      <h2>サーバー</h2>
      <div id="server-datasets"><p class="muted">読み込み中...</p></div>
    </section>
    <section style="margin-top:12px">
      <h2>ダウンロード済み</h2>
      <div id="local-datasets"><p class="muted">読み込み中...</p></div>
    </section>
  </div>

  <!-- ===== クロール ===== -->
  <div id="screen-crawl" class="screen hidden">
    <div class="sub-header">
      <button onclick="closeSubScreen()" class="back-btn">&larr;</button>
      <h2>Crawl</h2>
    </div>
    <div id="crawl-offline" class="hidden">
      <p class="muted" style="padding:40px 16px;text-align:center">サーバーに接続してください</p>
    </div>
    <div id="crawl-online">
      <section>
        <div class="input-row">
          <input type="text" id="crawl-url" placeholder="URL" autocomplete="url">
          <button onclick="selectTarget()">設定</button>
        </div>
      </section>
      <section id="crawl-config" class="hidden">
        <h2 id="crawl-target"></h2>
        <div class="options-row">
          <label>深さ: <input type="number" id="crawl-depth" value="0" min="0" max="999" placeholder="0=無制限"></label>
          <label>遅延: <input type="number" id="crawl-delay" value="1.0" min="0.5" max="30" step="0.5">s</label>
        </div>
        <div class="options-row">
          <label>除外: <input type="text" id="crawl-exclude" placeholder="パターン (カンマ区切り)" class="wide-input"></label>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="btn-crawl" class="btn-action" onclick="doCrawl()">開始</button>
          <button id="btn-stop" class="btn-action hidden" onclick="stopCrawl()" style="background:var(--warn);color:var(--bg)">停止</button>
        </div>
      </section>
      <section id="crawl-sites" style="margin-top:12px">
        <h2>サイト</h2>
        <div id="sites-list"><p class="muted">読み込み中...</p></div>
      </section>
      <section id="import-section" style="margin-top:12px">
        <h2>インポート</h2>
        <p class="muted" style="margin:0 0 8px">tar.gz アーカイブからサーバー経由で復元</p>
        <label class="btn-import-label">
          .tar.gz を選択
          <input type="file" id="import-file" accept=".tar.gz,.tgz,.tar" hidden>
        </label>
        <div id="import-status" class="hidden" style="margin-top:8px"></div>
      </section>
      <section id="progress-section" class="hidden">
        <h2>ログ</h2>
        <div id="log-area"></div>
      </section>
    </div>
  </div>

  <!-- 下部ナビ（常時表示） -->
  <nav id="main-nav">
    <button data-nav="search" onclick="goHome()"><span>&#128269;</span>検索</button>
    <button data-nav="data" onclick="showScreen('screen-data')"><span>&#128230;</span>データ</button>
    <button data-nav="crawl" onclick="showScreen('screen-crawl')"><span>&#127760;</span>クロール</button>
    <button data-nav="history" onclick="showScreen('screen-history')"><span>&#9201;</span>履歴</button>
    <button data-nav="bookmarks" onclick="showScreen('screen-bookmarks')"><span>&#9733;</span>ブクマ</button>
  </nav>

  <!-- スーパーリロード -->
  <button id="super-reload" onclick="(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}catch(e){}window.location.href=window.location.pathname+'?_='+Date.now()})()" style="position:fixed;top:4px;right:4px;z-index:999;width:28px;height:28px;border:none;border-radius:50%;background:rgba(255,255,255,0.08);color:#fff;font-size:14px;cursor:pointer;opacity:0.3">&#8635;</button>

  <script>
  // CDNキャッシュ対策: サーバーのバージョンと比較して古ければリロード（最大1回）
  (function(){
    if (sessionStorage.getItem('_vcheck')) return;
    var scripts = document.querySelectorAll('script[src*="?v="]');
    var localVer = scripts.length > 0 ? (scripts[0].src.match(/v=([^&"]+)/) || [])[1] : null;
    fetch('/api/version').then(function(r){return r.json()}).then(function(d){
      if (d.version && d.version !== localVer) {
        sessionStorage.setItem('_vcheck', '1');
        window.location.href = '/?_=' + Date.now();
      }
    }).catch(function(){});
  })();
  </script>
  <script src="/static/db.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/search.js"></script>
  <script src="/static/datasets.js"></script>
  <script src="/static/viewer.js"></script>
  <script src="/static/crawl.js"></script>
</body>
</html>
