<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Localnet</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" type="image/png" href="/static/icon-192.png">
</head>
<body>
  <div id="app">

    <!-- ===== 検索タブ ===== -->
    <div id="tab-search" class="tab-panel">
      <header><h1>Localnet</h1></header>

      <section id="search-bar">
        <div class="input-row">
          <input type="search" id="search-input" placeholder="ローカルインターネットを検索" autocomplete="off">
          <button onclick="doSearch()">検索</button>
        </div>
        <p class="search-hint muted">引用符で完全一致 / スペースでAND検索</p>
      </section>

      <div id="search-results"></div>
      <div id="search-empty" class="hidden">
        <p class="muted">データセットがありません。「データ」タブからダウンロードしてください。</p>
      </div>
    </div>

    <!-- ===== ページ表示 ===== -->
    <div id="tab-viewer" class="tab-panel hidden">
      <div id="viewer-bar">
        <button id="viewer-back" onclick="closeViewer()">&larr; 戻る</button>
        <span id="viewer-url" class="muted"></span>
      </div>
      <iframe id="viewer-frame" sandbox="allow-same-origin"></iframe>
    </div>

    <!-- ===== データセットタブ ===== -->
    <div id="tab-data" class="tab-panel hidden">
      <header><h1>Datasets</h1></header>

      <section id="server-datasets-section">
        <h2>サーバー上のデータセット</h2>
        <div id="server-datasets"><p class="muted">読み込み中...</p></div>
      </section>

      <section id="local-datasets-section">
        <h2>ダウンロード済み</h2>
        <div id="local-datasets"><p class="muted">読み込み中...</p></div>
      </section>
    </div>

    <!-- ===== クロールタブ ===== -->
    <div id="tab-crawl" class="tab-panel hidden">
      <header><h1>Crawl</h1></header>

      <div id="crawl-offline" class="hidden">
        <p class="muted">サーバーに接続してください。</p>
      </div>

      <div id="crawl-online">
        <section id="url-bar">
          <div class="input-row">
            <input type="text" id="crawl-url" placeholder="スクレイピングするURLを入力" autocomplete="url">
            <button onclick="selectTarget()">設定</button>
          </div>
        </section>

        <section id="crawl-config" class="hidden">
          <h2 id="crawl-target"></h2>
          <div class="options-row">
            <label>深さ: <input type="number" id="crawl-depth" value="2" min="0" max="10"></label>
            <label>遅延: <input type="number" id="crawl-delay" value="1.0" min="0.5" max="30" step="0.5">s</label>
            <label>上限: <input type="number" id="crawl-limit" value="5000" min="100" max="50000"></label>
          </div>
          <div class="options-row">
            <label>除外: <input type="text" id="crawl-exclude" placeholder="パターン (カンマ区切り)" class="wide-input"></label>
          </div>
          <div class="options-row">
            <label><input type="checkbox" id="crawl-autobuild" checked> データセット自動生成</label>
          </div>
          <div style="margin-top:12px">
            <button id="btn-crawl" class="btn-action" onclick="doCrawl()">クロール開始</button>
          </div>
        </section>

        <section id="crawl-sites" style="margin-top:16px">
          <h2>クロール済みサイト</h2>
          <div id="sites-list"><p class="muted">読み込み中...</p></div>
        </section>

        <section id="progress-section" class="hidden">
          <h2>ログ</h2>
          <div id="log-area"></div>
        </section>
      </div>
    </div>

  </div>

  <!-- スーパーリロード -->
  <button id="super-reload" onclick="(async()=>{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}const keys=await caches.keys();for(const k of keys)await caches.delete(k);location.reload(true)})()" title="キャッシュ全消去&amp;リロード" style="position:fixed;top:4px;right:4px;z-index:999;width:28px;height:28px;border:none;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;font-size:14px;cursor:pointer;opacity:0.4">&#8635;</button>

  <!-- 下部ナビゲーション -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="tab-search" onclick="switchTab('tab-search')">
      <span class="nav-icon">&#128269;</span>
      <span class="nav-label">検索</span>
    </button>
    <button class="nav-btn" data-tab="tab-data" onclick="switchTab('tab-data')">
      <span class="nav-icon">&#128230;</span>
      <span class="nav-label">データ</span>
    </button>
    <button class="nav-btn" data-tab="tab-crawl" onclick="switchTab('tab-crawl')">
      <span class="nav-icon">&#127760;</span>
      <span class="nav-label">クロール</span>
    </button>
  </nav>

  <script src="https://sql.js.org/dist/sql-wasm.js"></script>
  <script src="/static/db.js"></script>
  <script src="/static/sqldb.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/search.js"></script>
  <script src="/static/datasets.js"></script>
  <script src="/static/viewer.js"></script>
  <script src="/static/crawl.js"></script>
</body>
</html>
