plugins {
    id 'com.android.application'
}

android {
    namespace 'net.localnet.app'
    compileSdk 34

    defaultConfig {
        applicationId "net.localnet.app"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "2.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress "tar.gz"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
