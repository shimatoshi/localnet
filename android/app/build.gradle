plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'net.localnet.app'
    compileSdk 34

    defaultConfig {
        applicationId "net.localnet.app"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.4.0"

        python {
            version "3.13"
            pip {
                install "flask"
                install "requests"
                install "beautifulsoup4"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
